<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Sign in · EchoAI</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-page"><div class="auth-card"><div class="brand auth-brand"><span class="brand-mark">✦</span><div><b>EchoAI</b><small>Your personal assistant</small></div></div><h1>Welcome</h1><p class="muted">Sign in or create an account to keep your assistant data private.</p>
{% if error %}<div class="error-box">{{ error }}</div>{% endif %}
<div class="auth-tabs"><button class="active" data-auth-tab="login">Sign in</button><button data-auth-tab="register">Create account</button></div>
<form id="loginForm" action="{{ url_for('login') }}" method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username or email<input name="identity" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary wide">Sign in</button></form>
<form id="registerForm" action="{{ url_for('register') }}" method="post" class="auth-form hidden"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" required minlength="3" maxlength="40" autocomplete="username"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="10" autocomplete="new-password"><small>Use at least 10 characters.</small></label><button class="primary wide">Create account</button></form></div><script>document.querySelectorAll('[data-auth-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-auth-tab]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('loginForm').classList.toggle('hidden',b.dataset.authTab!=='login');document.getElementById('registerForm').classList.toggle('hidden',b.dataset.authTab!=='register')});</script></body></html>
