<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}"><title>EchoAI · Personal Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">✦</span><div><b>EchoAI</b><small>Personal assistant</small></div></div>
    <button class="primary wide" id="newChat">＋ New chat</button>
    <div class="side-label">RECENT</div><nav id="conversationList" class="conversation-list" aria-label="Conversations"></nav>
    <div class="side-bottom">
      <button class="side-link" data-panel="memories">✧ <span>Memories</span></button>
      <button class="side-link" data-panel="documents">▤ <span>Documents</span></button>
      <button class="side-link" data-panel="tasks">✓ <span>Tasks</span></button>
      <div class="profile"><div class="avatar" id="userAvatar">E</div><span id="username">Account</span><button id="themeToggle" class="icon-btn" title="Toggle light or dark theme">◐</button>
        <form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="icon-btn" title="Sign out">↪</button></form>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><button id="menuToggle" class="icon-btn mobile-only" aria-label="Open menu">☰</button><div><strong id="chatTitle">New chat</strong><small class="status">● Gemini assistant</small></div><div class="top-actions"><label class="search-toggle"><input type="checkbox" id="searchToggle"> Search web</label></div></header>
    <section id="chatPanel" class="chat-panel">
      <div id="welcome" class="welcome"><div class="welcome-mark">✦</div><h1>What can I help with?</h1><p>Ask a question, explore an idea, or work with your personal library.</p><div class="suggestions"><button>Help me plan my week</button><button>Remember my preferences</button><button>Summarize a document</button></div></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="typing" class="typing hidden">EchoAI is thinking<span>•••</span></div>
    </section>
    <div class="composer-wrap"><div id="filePreview" class="file-preview"></div><form id="chatForm" class="composer"><button type="button" id="attachBtn" class="icon-btn" title="Attach files">＋</button><input id="fileInput" type="file" multiple hidden accept=".pdf,.docx,.txt,.md,.markdown,.csv,.tsv,.json,.log,.yaml,.yml,.xml,.html,.htm,.css,.py,.js,.ts,.tsx,.jsx,.java,.c,.cpp,.h,.hpp,.cs,.go,.rs,.rb,.php,.sh,.bat,.sql,.ini,.cfg,.toml"><textarea id="messageInput" rows="1" placeholder="Message EchoAI…"></textarea><button type="button" id="micBtn" class="icon-btn" title="Speak your message">🎙</button><button type="submit" id="sendBtn" class="send-btn" aria-label="Send">↑</button></form><div class="composer-foot">PDF, DOCX, TXT and text files · 10 MB per file <span id="voiceStatus"></span></div></div>
  </main>
</div>
<div id="panelBackdrop" class="backdrop hidden"></div>
<aside id="drawer" class="drawer" aria-label="Assistant library"><div class="drawer-head"><h2 id="drawerTitle">Memories</h2><button id="closeDrawer" class="icon-btn">×</button></div><div id="drawerBody"></div></aside>
<div id="toast" class="toast" role="status"></div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body></html>
